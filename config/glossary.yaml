# Overview terminology
plant: "A complete solar power generation facility consisting of multiple blocks, inverters, solar panels, and grid connection equipment."
block: "A modular subsection of a solar power plant grouping multiple inverters and solar arrays."
inverter: "An electrical device that converts direct current (DC) electricity produced by solar panels into alternating current (AC) electricity for the grid."
mwp: "Megawatt-peak, a unit measuring the maximum rated DC power output of a solar power plant under standard test conditions."
MWp: "Megawatt-peak, a unit measuring the maximum rated DC power output of a solar power plant under standard test conditions."

